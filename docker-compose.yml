version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menumanager
      POSTGRES_PASSWORD: menumanager
      POSTGRES_DB: menumanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menumanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menu-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://menumanager:menumanager@postgres:5432/menumanager"
      JWT_SECRET: "sua-chave-secreta-super-segura-aqui-min-32-caracteres"
      NODE_ENV: "production"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - menu-network

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run build && npm install -g serve && serve -s dist -l 3001"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      VITE_API_URL: "http://localhost:3000/api"
    depends_on:
      - backend
    networks:
      - menu-network

networks:
  menu-network:
    driver: bridge

volumes:
  pgdata:
