appId: br.com.novarota.pdv
productName: NovaRota PDV
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!tsconfig*.json'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
